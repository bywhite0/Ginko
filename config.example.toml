# Copy to config.local.toml. This example has zero budget and cannot authorize paid calls.
config_version = 1
agent_id = "ginko"
data_dir = "data"
approved_persona_version = "1.0.0"
behavior = "mixed"
autonomous = false
relationships = []

[[allowed_sessions]]
kind = "private"
chat_id = "20001"

[onebot]
bot_id = "10000"
host = "127.0.0.1"
port = 8080
access_token_env = "GINKO_ONEBOT_ACCESS_TOKEN"
api_timeout_seconds = 10.0

[model]
protocol = "chat_completions"
base_url = "https://api.example.invalid/v1"
model = "deepseek-flash"
api_key_env = "GINKO_MODEL_API_KEY"
timeout_seconds = 30.0
max_input_tokens = 16000
max_output_tokens = 1000
# Example rates only; verify your account's actual prices before paid use.
# 1 USD = 1,000,000 micro-USD. Rates below apply to one million tokens.
# DeepSeek official off-peak prices; they apply whenever no rate window matches.
input_microusd_per_million_tokens = 150000
cached_input_microusd_per_million_tokens = 3000
output_microusd_per_million_tokens = 600000
price_checked_on = 2026-09-25

# Peak hours are UTC, Monday (1) to Friday (5). A call touching any window pays its
# rates; reservations use the highest rates. List verified public holidays as UTC
# dates in excluded_dates; unlisted holidays settle at peak rates.
[[model.rate_windows]]
name = "peak"
weekdays = [1, 2, 3, 4, 5]
utc_ranges = ["01:00-04:00", "06:00-10:00"]
input_microusd_per_million_tokens = 300000
cached_input_microusd_per_million_tokens = 6000
output_microusd_per_million_tokens = 1200000
excluded_dates = []

[budget]
daily_microusd = 0
monthly_microusd = 0

[activity]
lease_seconds = 60
ttl_seconds = 300
max_attempts = 2
max_input_chars = 2000
max_reply_chars = 1000
